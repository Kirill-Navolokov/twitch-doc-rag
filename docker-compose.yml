services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-twitch_docs_rag}
      POSTGRES_USER: ${POSTGRES_USER:-twitch_docs_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twitch_docs_rag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twitch_docs_rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  weaviate:
    image: semitechnologies/weaviate:1.39.3
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      # No embedding module: every vector is supplied by the worker from Chunk.embedding.
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-twitch_docs_rag}
      POSTGRES_USER: ${POSTGRES_USER:-twitch_docs_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twitch_docs_rag}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-local-development-key}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      WEAVIATE_URL: ${WEAVIATE_URL:-http://weaviate:8080}
    volumes:
      - ./worker:/app/worker
      - ./shared:/app/shared
      - ./docs:/app/docs
      - ./ruff.toml:/app/ruff.toml
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      weaviate:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-twitch_docs_rag}
      POSTGRES_USER: ${POSTGRES_USER:-twitch_docs_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twitch_docs_rag}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-local-development-key}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      WEAVIATE_URL: ${WEAVIATE_URL:-http://weaviate:8080}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      RELEVANCE_THRESHOLD: ${RELEVANCE_THRESHOLD:-0.90}
    volumes:
      - ./api:/app/api
      - ./shared:/app/shared
      - ./docs:/app/docs
      - ./ruff.toml:/app/ruff.toml
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # Reached from the user's browser, outside this network, so it has to be the published port of
      # `api` on the host — never the internal hostname `api`.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        # `api` defines no healthcheck, so this only orders the start. The UI reports a failure of
        # its own if a question is asked before `api` is listening.
        condition: service_started

volumes:
  postgres_data:
  weaviate_data:
