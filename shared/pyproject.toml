[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shared"
version = "0.1.0"
description = "Postgres models and provider clients shared by the worker and api projects."
requires-python = ">=3.13"
dependencies = ["Django>=5.2,<6.0", "voyageai>=0.5,<0.6"]

[tool.setuptools.packages.find]
include = ["shared*"]
